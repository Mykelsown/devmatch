<svg width="440" height="120" viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>DevMatch logo</title>
  <desc>DevMatch wordmark beside an eclipse icon of a merged sun and moon</desc>
  <defs>
    <linearGradient id="sun2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD27A"/>
      <stop offset="100%" stop-color="#F2A93C"/>
    </linearGradient>
    <linearGradient id="moon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A45"/>
      <stop offset="100%" stop-color="#0B0F2E"/>
    </linearGradient>
    <radialGradient id="corona2" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#7DE8D0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7DE8D0" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="120" height="120" rx="28" fill="#080B22"/>
  <circle cx="60" cy="60" r="38" fill="url(#corona2)"/>
  <circle cx="60" cy="60" r="32" fill="url(#sun2)"/>
  <circle cx="71" cy="60" r="32" fill="url(#moon2)"/>

  <text x="150" y="75" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#0B0F2E">Dev<tspan fill="#159E9E">Match</tspan></text>
</svg>
